[project]
name = "cdedpp"
version = "0.1.0"
description = "Ambiente de Ciencia de Dados e Estatistica para a disciplina CDEDPP, gerenciado com uv"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lifelines>=0.30.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scikit-posthocs>=0.17.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbconvert>=7.17.1",
]
